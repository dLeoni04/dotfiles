fullscreen=yes

# ==============================================================================
# PROFILO PRESTAZIONI MASSIME (PER PC POCO POTENTI)
# ==============================================================================
# Profilo a bassissimo consumo per alleggerire la scheda grafica
profile=fast

# Usa il motore grafico standard e leggero
vo=gpu
gpu-api=d3d11

# Tenta di usare la decodifica hardware Direct3D11 (la più leggera su Windows)
hwdec=d3d11va

# Salta i fotogrammi anziché andare a rallentatore se la CPU non ce la fa
framedrop=vo

# ==============================================================================
# IMPOSTAZIONI YOUTUBE / YTDL
# ==============================================================================
# Sceglie la qualità migliore in 1080p a 60fps (evita di scaricare inutilmente il 4K)
# ytdl-format="bestvideo[height<=?1080][fps<=?60]+bestaudio/best"
ytdl-format="bestvideo[height<=?480]+bestaudio/best"
# Se preferisci sempre la MASSIMA qualità disponibile (anche 4K o 8K), usa questa riga:
# ytdl-format="bestvideo+bestaudio/best"

# Sottotitoli automatici da YouTube (in italiano o inglese)
ytdl-raw-options=write-auto-sub=,sub-lang="it,en"
